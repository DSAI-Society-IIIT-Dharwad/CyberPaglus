apiVersion: v1
kind: Namespace
metadata:
  name: ingestion-test-ns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-sa
  namespace: ingestion-test-ns
---
apiVersion: v1
kind: Secret
metadata:
  name: test-secret-password
  namespace: ingestion-test-ns
type: Opaque
data:
  password: cGFzc3dvcmQxMjMK # password123
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-config
  namespace: ingestion-test-ns
data:
  config.json: '{"key": "value"}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader-role
  namespace: ingestion-test-ns
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-secrets-binding
  namespace: ingestion-test-ns
subjects:
- kind: ServiceAccount
  name: test-sa
  namespace: ingestion-test-ns
roleRef:
  kind: Role
  name: secret-reader-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  namespace: ingestion-test-ns
  labels:
    app: vulnerable-app
spec:
  serviceAccountName: test-sa
  containers:
  - name: my-container
    image: nginx:1.24-alpine
    ports:
    - containerPort: 80
