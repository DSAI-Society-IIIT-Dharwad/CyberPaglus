services:
  # ── Backend: Python FastAPI Web Service ──
  - type: web
    name: kubeinsights-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false # Must be set manually in Render Dashboard

  # ── Frontend: React Static Site ──
  - type: web
    name: kubeinsights-ui
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://kubeinsights-api.onrender.com
